spring.application.name=ms-clientes

server.port=${PORT:8081}

# Conexion a MySQL SOLO por variables de entorno (sin contrasenas en el codigo):
#   DB_URL, DB_USER, DB_PASSWORD
# Si no existen, se usa XAMPP local (root sin contrasena).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_techservices?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.jackson.time-zone=America/Lima

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
